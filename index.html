<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pattulo — Contract Award Review Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=DM+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #f0f4f8; }
    textarea, input, select { font-family: 'DM Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    button:focus { outline: 2px solid #1B3A6B; outline-offset: 2px; }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ─── !! CONFIGURATION — Update these for each new contract !! ──────────────
    const CONFIG = {
      // Microsoft Azure App Registration — see README for setup
      clientId:     "36f24ca2-9876-4a95-9582-1e6b36e77f2f",   // Azure App Registration Client ID
      tenantId:     "a51ac21d-f865-4220-ae65-5b9a8450f01f",        // Azure Tenant ID (from Azure AD)
      // SharePoint
      siteId:       "vanmaron.sharepoint.com,N5UlyHYD-0COBKYb1l7kgupZEti1MWVGuDxcq3_DVcBTKu3dHubHRIrcmid_elk6",
      listName:     "ContractReviews",
      siteUrl:      "https://vanmaron.sharepoint.com/sites/Pattulo",
    };

    const PROJECT = {
      projectName:  "Station Park — Phase 2",
      contractNo:   "CAA-2026-041",
      contractTitle:"Structural Steel Supply & Erect",
      contractor:   "Allied Steel Works Inc.",
      issueDate:    "2026-06-02",
      dueDate:      "2026-06-16",
      owner:        "John Hoeve",
      ownerEmail:   "john.hoeve@vanmaron.com",
    };

    const REVIEWERS = [
      { id:"r1", name:"Sarah Mitchell",  role:"Structural Engineer", company:"AECOM",            email:"s.mitchell@aecom.com" },
      { id:"r2", name:"Derek Park",      role:"Project Manager",     company:"Metrolinx",         email:"d.park@metrolinx.com" },
      { id:"r3", name:"Camille Dubois",  role:"Architect",           company:"B+H Architects",    email:"c.dubois@bharchitects.com" },
      { id:"r4", name:"Marcus Webb",     role:"Cost Consultant",     company:"Turner & Townsend", email:"m.webb@tat.com" },
    ];

    const DOCS = [
      { id:"d1", name:"Contract Draft",        file:"CAA-2026-041_Contract_Draft.pdf",           url:"" },
      { id:"d2", name:"Structural Drawings",   file:"CAA-2026-041_Structural_Drawings_Rev3.pdf", url:"" },
      { id:"d3", name:"Bill of Quantities",    file:"CAA-2026-041_Bill_of_Quantities.xlsx",      url:"" },
    ];
    // ──────────────────────────────────────────────────────────────────────────

    // ─── GRAPH API helpers — OAuth implicit flow ─────────────────────────────
    async function getToken() {
      const stored = sessionStorage.getItem("pattulo_ms_token");
      if (stored) return stored;
      throw new Error("NOT_SIGNED_IN");
    }

    async function graphGet(path) {
      const token = await getToken();
      const r = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!r.ok) throw new Error(`Graph GET failed: ${r.status} ${path}`);
      return r.json();
    }

    async function graphPost(path, body) {
      const token = await getToken();
      const r = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) { const t = await r.text(); throw new Error(`Graph POST failed: ${r.status} ${t}`); }
      return r.json();
    }

    async function graphPatch(path, body) {
      const token = await getToken();
      const r = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
        method: "PATCH",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) { const t = await r.text(); throw new Error(`Graph PATCH failed: ${r.status} ${t}`); }
      return r.json();
    }

    // ─── SharePoint List operations ───────────────────────────────────────────
    const listBase = () => `/sites/${CONFIG.siteId}/lists/${CONFIG.listName}/items`;

    async function fetchAllReviews(contractNo) {
      const data = await graphGet(
        `${listBase()}?$filter=fields/ContractNo eq '${contractNo}'&$expand=fields&$top=50`
      );
      return data.value || [];
    }

    async function upsertReview(contractNo, reviewer, fields) {
      // Check if row exists
      const existing = await graphGet(
        `${listBase()}?$filter=fields/ContractNo eq '${contractNo}' and fields/ReviewerID eq '${reviewer.id}'&$expand=fields`
      );
      const rows = existing.value || [];
      const payload = {
        fields: {
          Title:        `${contractNo}-${reviewer.id}`,
          ContractNo:   contractNo,
          ReviewerID:   reviewer.id,
          ReviewerName: reviewer.name,
          ...fields,
        }
      };
      if (rows.length > 0) {
        const itemId = rows[0].id;
        return graphPatch(`${listBase()}/${itemId}`, { fields: payload.fields });
      } else {
        return graphPost(listBase(), payload);
      }
    }

    async function fetchPhase(contractNo) {
      try {
        const data = await graphGet(
          `${listBase()}?$filter=fields/ContractNo eq '${contractNo}' and fields/ReviewerID eq 'phase'&$expand=fields`
        );
        const rows = data.value || [];
        return rows.length > 0 ? (rows[0].fields?.Phase || "initial") : "initial";
      } catch { return "initial"; }
    }

    async function setPhase(contractNo, phase) {
      const existing = await graphGet(
        `${listBase()}?$filter=fields/ContractNo eq '${contractNo}' and fields/ReviewerID eq 'phase'&$expand=fields`
      );
      const rows = existing.value || [];
      const payload = { fields: { Title:`${contractNo}-phase`, ContractNo:contractNo,
        ReviewerID:"phase", ReviewerName:"SYSTEM", Phase:phase } };
      if (rows.length > 0) {
        return graphPatch(`${listBase()}/${rows[0].id}`, { fields: payload.fields });
      } else {
        return graphPost(listBase(), payload);
      }
    }

    // ─── HELPERS ──────────────────────────────────────────────────────────────
    const now = () => new Date().toLocaleDateString("en-CA");
    const initials = name => name.split(" ").map(n => n[0]).join("");

    // ─── COMPONENTS ───────────────────────────────────────────────────────────
    const BADGE = {
      approved:       { label:"Approved",           bg:"#d1fae5", color:"#065f46", dot:"#10b981" },
      approved_noted: { label:"Approved as Noted",  bg:"#fef3c7", color:"#92400e", dot:"#f59e0b" },
      more_info:      { label:"More Info Required",  bg:"#ede9fe", color:"#4c1d95", dot:"#8b5cf6" },
      viewed:         { label:"Viewed",              bg:"#e0f2fe", color:"#0369a1", dot:"#0ea5e9" },
      pending:        { label:"Pending",             bg:"#f1f5f9", color:"#64748b", dot:"#94a3b8" },
    };

    function Badge({ type }) {
      const s = BADGE[type] || BADGE.pending;
      return (
        <span style={{ display:"inline-flex", alignItems:"center", gap:5, background:s.bg,
          color:s.color, borderRadius:20, padding:"3px 10px", fontSize:11, fontWeight:600, whiteSpace:"nowrap" }}>
          <span style={{ width:6, height:6, borderRadius:"50%", background:s.dot, display:"inline-block" }} />
          {s.label}
        </span>
      );
    }

    function Pri({ level }) {
      const m = { high:["#ef4444","#fee2e2"], medium:["#f59e0b","#fef3c7"], low:["#22c55e","#dcfce7"] };
      const [c,b] = m[level]||m.medium;
      return <span style={{ background:b, color:c, borderRadius:4, padding:"1px 7px",
        fontSize:10, fontWeight:700, fontFamily:"'DM Mono',monospace" }}>{level.toUpperCase()}</span>;
    }

    function Spinner({ text="Loading…" }) {
      return (
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center",
          justifyContent:"center", padding:60, gap:14 }}>
          <div style={{ width:36, height:36, border:"3px solid #e2e8f0",
            borderTop:"3px solid #1B3A6B", borderRadius:"50%" }} className="spin" />
          <p style={{ color:"#64748b", fontSize:13 }}>{text}</p>
        </div>
      );
    }

    function Toast({ msg, type="success", onClose }) {
      useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, []);
      return (
        <div style={{ position:"fixed", bottom:24, right:24, zIndex:9999,
          background: type==="error"?"#fee2e2":"#d1fae5",
          border:`1px solid ${type==="error"?"#fca5a5":"#6ee7b7"}`,
          color: type==="error"?"#991b1b":"#065f46",
          borderRadius:10, padding:"12px 18px", fontSize:13, fontWeight:600,
          boxShadow:"0 4px 16px rgba(0,0,0,0.12)", maxWidth:320 }}>
          {type==="error" ? "⚠️ " : "✓ "}{msg}
        </div>
      );
    }

    function CommentCard({ comment }) {
      return (
        <div style={{ background:"#fff", borderRadius:10, padding:"14px 16px",
          border:"1px solid #e8edf3", marginBottom:10, boxShadow:"0 1px 3px rgba(0,0,0,0.04)" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8 }}>
            <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
              <span style={{ fontFamily:"'DM Mono',monospace", fontSize:11, color:"#94a3b8", fontWeight:600 }}>
                #{String(comment.id).padStart(2,"0")}
              </span>
              <span style={{ fontSize:12, fontWeight:600, color:"#1B3A6B" }}>{comment.section}</span>
              {comment.page && <span style={{ fontSize:11, color:"#64748b" }}>p.{comment.page}</span>}
              <Pri level={comment.priority} />
            </div>
            <span style={{ fontSize:11, color:"#94a3b8", whiteSpace:"nowrap" }}>{comment.createdAt}</span>
          </div>
          <p style={{ fontSize:13, color:"#334155", margin:"0 0 6px", lineHeight:1.55 }}>{comment.text}</p>
          {comment.recommendation && (
            <p style={{ fontSize:12, color:"#64748b", margin:0, fontStyle:"italic" }}>
              <b style={{ color:"#1B3A6B" }}>Rec:</b> {comment.recommendation}
            </p>
          )}
        </div>
      );
    }

    function AddCommentForm({ onAdd, nextId, saving }) {
      const [f, setF] = useState({ section:"", page:"", text:"", recommendation:"", priority:"medium" });
      const set = k => e => setF(p=>({...p,[k]:e.target.value}));
      const valid = f.section.trim() && f.text.trim();
      const inp = (k, ph, multi=false) => {
        const s = { width:"100%", border:"1.5px solid #e2e8f0", borderRadius:8, padding:"9px 12px",
          fontSize:13, color:"#1e293b", background:"#f8fafc", outline:"none",
          resize:multi?"vertical":"none", minHeight:multi?70:"auto" };
        return multi
          ? <textarea style={s} placeholder={ph} value={f[k]} onChange={set(k)} />
          : <input style={s} placeholder={ph} value={f[k]} onChange={set(k)} />;
      };
      function submit() {
        if (!valid || saving) return;
        onAdd({ id:nextId, section:f.section.trim(), page:f.page.trim(),
          text:f.text.trim(), recommendation:f.recommendation.trim(),
          priority:f.priority, createdAt:now() });
        setF({ section:"", page:"", text:"", recommendation:"", priority:"medium" });
      }
      return (
        <div style={{ background:"#f0f5ff", borderRadius:12, padding:16,
          border:"1.5px dashed #93b4dc", marginTop:16 }}>
          <p style={{ fontWeight:700, color:"#1B3A6B", fontSize:13, marginBottom:12 }}>+ Add Comment</p>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 80px", gap:8, marginBottom:8 }}>
            {inp("section","Document / Section / Clause *")}
            {inp("page","Page #")}
          </div>
          {inp("text","Describe the issue or comment in detail *", true)}
          <div style={{ marginTop:8 }}>{inp("recommendation","Recommendation (optional)", true)}</div>
          <div style={{ display:"flex", gap:8, alignItems:"center", marginTop:10, flexWrap:"wrap" }}>
            <span style={{ fontSize:12, color:"#475569", fontWeight:600 }}>Priority:</span>
            {["high","medium","low"].map(p => (
              <button key={p} onClick={()=>setF(x=>({...x,priority:p}))} style={{
                padding:"4px 12px", borderRadius:6, fontSize:11, fontWeight:700, cursor:"pointer", border:"none",
                background:f.priority===p?(p==="high"?"#ef4444":p==="medium"?"#f59e0b":"#22c55e"):"#e2e8f0",
                color:f.priority===p?"#fff":"#64748b" }}>
                {p.charAt(0).toUpperCase()+p.slice(1)}
              </button>
            ))}
            <button onClick={submit} disabled={!valid||saving} style={{
              marginLeft:"auto", padding:"7px 20px", borderRadius:8,
              background:valid&&!saving?"#1B3A6B":"#e2e8f0",
              color:valid&&!saving?"#fff":"#94a3b8",
              border:"none", cursor:valid&&!saving?"pointer":"default", fontWeight:700, fontSize:13 }}>
              {saving ? <span><span className="spin">⟳</span> Saving…</span> : "Save to SharePoint"}
            </button>
          </div>
        </div>
      );
    }

    // ─── REVIEWER VIEW ────────────────────────────────────────────────────────
    function ReviewerView({ reviewer, reviewData, allData, onDecision, onAddComment, saving }) {
      const [tab, setTab] = useState(reviewer.id);
      const vs = allData[tab] || {};
      const vr = REVIEWERS.find(r=>r.id===tab);
      const isOwn = tab === reviewer.id;
      const myData = reviewData || {};
      const myComments = myData.comments || [];

      const decisions = [
        { key:"approved",       label:"✓  Approved",           c:"#10b981", bg:"#d1fae5" },
        { key:"approved_noted", label:"~  Approved as Noted",  c:"#f59e0b", bg:"#fef3c7" },
        { key:"more_info",      label:"?  More Info Required",  c:"#8b5cf6", bg:"#ede9fe" },
      ];

      return (
        <div>
          {/* Decision */}
          <div style={{ background:"#fff", borderRadius:12, padding:20, marginBottom:20,
            border:"1px solid #e8edf3", boxShadow:"0 1px 4px rgba(0,0,0,0.05)" }}>
            <p style={{ fontWeight:700, color:"#1B3A6B", fontSize:14, marginBottom:14 }}>Your Review Decision</p>
            <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
              {decisions.map(d => (
                <button key={d.key} onClick={()=>onDecision(d.key)} disabled={saving} style={{
                  flex:1, minWidth:140, padding:"12px 14px", borderRadius:10, cursor:"pointer",
                  border:`2px solid ${myData.decision===d.key?d.c:"#e2e8f0"}`,
                  background:myData.decision===d.key?d.bg:"#f8fafc",
                  color:myData.decision===d.key?d.c:"#64748b",
                  fontWeight:700, fontSize:13, transition:"all 0.15s",
                  opacity:saving?0.6:1 }}>
                  {d.label}
                </button>
              ))}
            </div>
            {myData.decision && (
              <p style={{ fontSize:12, color:"#64748b", marginTop:8 }}>
                ✓ Saved to SharePoint — {myData.decidedAt}
              </p>
            )}
          </div>

          {/* Sub-tabs */}
          <div style={{ display:"flex", gap:6, marginBottom:16, overflowX:"auto", paddingBottom:4 }}>
            {REVIEWERS.map(r => {
              const s = allData[r.id] || {};
              const active = tab===r.id;
              return (
                <button key={r.id} onClick={()=>setTab(r.id)} style={{
                  padding:"7px 14px", borderRadius:8, cursor:"pointer", whiteSpace:"nowrap",
                  border:active?"2px solid #1B3A6B":"2px solid #e2e8f0",
                  background:active?"#1B3A6B":"#f8fafc",
                  color:active?"#fff":"#64748b", fontWeight:600, fontSize:12 }}>
                  {r.name.split(" ")[0]}
                  {(s.comments||[]).length>0 &&
                    <span style={{ marginLeft:5, opacity:0.75 }}>({s.comments.length})</span>}
                </button>
              );
            })}
          </div>

          {/* Comments */}
          <div style={{ background:"#fff", borderRadius:12, padding:20,
            border:"1px solid #e8edf3", boxShadow:"0 1px 4px rgba(0,0,0,0.05)" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
              <div>
                <p style={{ fontWeight:700, color:"#1B3A6B", fontSize:14, margin:0 }}>
                  {isOwn ? "Your Comments" : `${vr?.name}'s Comments`}
                </p>
                <p style={{ fontSize:12, color:"#64748b", marginTop:2 }}>{vr?.role} — {vr?.company}</p>
              </div>
              <Badge type={vs.decision||(vs.viewed?"viewed":"pending")} />
            </div>
            {(vs.comments||[]).length===0
              ? <p style={{ fontSize:13, color:"#94a3b8", fontStyle:"italic" }}>
                  {isOwn?"No comments yet — add one below.":"No comments submitted yet."}
                </p>
              : (vs.comments||[]).map(c=><CommentCard key={c.id} comment={c} />)
            }
            {isOwn && (
              <AddCommentForm
                onAdd={onAddComment}
                nextId={myComments.length+1}
                saving={saving}
              />
            )}
          </div>
        </div>
      );
    }

    // ─── DASHBOARD ────────────────────────────────────────────────────────────
    function Dashboard({ allData, loading }) {
      if (loading) return <Spinner text="Loading live data from SharePoint…" />;
      const total = REVIEWERS.length;
      const viewed  = REVIEWERS.filter(r=>(allData[r.id]||{}).viewed).length;
      const decided = REVIEWERS.filter(r=>(allData[r.id]||{}).decision).length;
      const totalC  = REVIEWERS.reduce((a,r)=>a+((allData[r.id]||{}).comments||[]).length,0);

      return (
        <div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12, marginBottom:20 }}>
            {[
              { label:"Reviewers", val:total,   sub:"invited",     c:"#1B3A6B" },
              { label:"Viewed",    val:viewed,  sub:`of ${total}`, c:"#0ea5e9" },
              { label:"Responded", val:decided, sub:`of ${total}`, c:"#10b981" },
              { label:"Comments",  val:totalC,  sub:"total",       c:"#f59e0b" },
            ].map(s=>(
              <div key={s.label} style={{ background:"#fff", borderRadius:12, padding:"16px 18px",
                border:"1px solid #e8edf3", boxShadow:"0 1px 4px rgba(0,0,0,0.05)" }}>
                <p style={{ fontFamily:"'DM Mono',monospace", fontWeight:700, fontSize:28,
                  color:s.c, margin:"0 0 2px" }}>{s.val}</p>
                <p style={{ fontSize:12, color:"#64748b", margin:0 }}>
                  {s.label} <span style={{ color:"#94a3b8" }}>{s.sub}</span>
                </p>
              </div>
            ))}
          </div>

          {/* Status table */}
          <div style={{ background:"#fff", borderRadius:12, border:"1px solid #e8edf3",
            overflow:"hidden", marginBottom:20 }}>
            <div style={{ padding:"14px 20px", borderBottom:"1px solid #e8edf3", background:"#f8fafc",
              display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <p style={{ fontWeight:700, color:"#1B3A6B", fontSize:14, margin:0 }}>Live Reviewer Status</p>
              <span style={{ fontSize:11, color:"#94a3b8" }}>↻ Synced with SharePoint</span>
            </div>
            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead>
                  <tr style={{ background:"#f8fafc" }}>
                    {["Reviewer","Company","Role","Viewed","Decision","Comments"].map(h=>(
                      <th key={h} style={{ padding:"10px 16px", textAlign:"left", fontSize:11,
                        fontWeight:700, color:"#64748b", letterSpacing:"0.05em",
                        borderBottom:"1px solid #e8edf3" }}>{h.toUpperCase()}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {REVIEWERS.map((r,i)=>{
                    const s = allData[r.id]||{};
                    return (
                      <tr key={r.id} style={{ borderBottom:i<REVIEWERS.length-1?"1px solid #f1f5f9":"none" }}>
                        <td style={{ padding:"12px 16px", fontWeight:600, color:"#1e293b", fontSize:13 }}>{r.name}</td>
                        <td style={{ padding:"12px 16px", fontSize:12, color:"#64748b" }}>{r.company}</td>
                        <td style={{ padding:"12px 16px", fontSize:12, color:"#64748b" }}>{r.role}</td>
                        <td style={{ padding:"12px 16px" }}>
                          {s.viewed
                            ? <span style={{ fontSize:12, color:"#10b981" }}>✓ {s.viewedAt}</span>
                            : <span style={{ fontSize:12, color:"#94a3b8" }}>Not yet</span>}
                        </td>
                        <td style={{ padding:"12px 16px" }}>
                          <Badge type={s.decision||(s.viewed?"viewed":"pending")} />
                        </td>
                        <td style={{ padding:"12px 16px", fontFamily:"'DM Mono',monospace",
                          fontSize:13, fontWeight:700,
                          color:(s.comments||[]).length>0?"#1B3A6B":"#94a3b8" }}>
                          {(s.comments||[]).length}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Master log */}
          <div style={{ background:"#fff", borderRadius:12, border:"1px solid #e8edf3", overflow:"hidden" }}>
            <div style={{ padding:"14px 20px", borderBottom:"1px solid #e8edf3", background:"#f8fafc",
              display:"flex", justifyContent:"space-between" }}>
              <p style={{ fontWeight:700, color:"#1B3A6B", fontSize:14, margin:0 }}>Master Comment Log</p>
              <span style={{ fontFamily:"'DM Mono',monospace", fontSize:12, color:"#64748b" }}>
                {totalC} total
              </span>
            </div>
            <div style={{ padding:16 }}>
              {totalC===0
                ? <p style={{ fontSize:13, color:"#94a3b8", fontStyle:"italic" }}>No comments yet.</p>
                : REVIEWERS.map(r=>{
                    const s = allData[r.id]||{};
                    if(!(s.comments||[]).length) return null;
                    return (
                      <div key={r.id} style={{ marginBottom:20 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
                          <div style={{ width:30, height:30, borderRadius:"50%", background:"#1B3A6B",
                            display:"flex", alignItems:"center", justifyContent:"center" }}>
                            <span style={{ color:"#fff", fontWeight:700, fontSize:11 }}>{initials(r.name)}</span>

    // ─── MAIN APP ─────────────────────────────────────────────────────────────
    function App() {
      const isConfigured = true;

      const [user, setUser]           = useState(null);
      const [msAccount, setMsAccount] = useState(null);
      const [msLoading, setMsLoading] = useState(false);
      const [allData, setAllData]     = useState({});
      const [phase, setPhaseState]    = useState("initial");
      const [dataLoading, setDataLoading] = useState(false);
      const [saving, setSaving]       = useState(false);
      const [tab, setTab]             = useState("review");
      const [toast, setToast]         = useState(null);
      const pollRef                   = useRef(null);

      if (!isConfigured) return <SetupScreen />;

      // Load all data from SharePoint
      const loadData = useCallback(async () => {
        try {
          const rows = await fetchAllReviews(PROJECT.contractNo);
          const map = {};
          let ph = "initial";
          rows.forEach(row => {
            const f = row.fields || {};
            if (f.ReviewerID === "phase") { ph = f.Phase || "initial"; return; }
            if (f.ReviewerID === "owner") {
              map["owner"] = {
                decision: f.Decision,
                comment:  f.CommentsJSON,
                signedAt: f.Phase,
              };
              return;
            }
            let comments = [];
            try { comments = JSON.parse(f.CommentsJSON || "[]"); } catch {}
            map[f.ReviewerID] = {
              viewed:    !!f.Phase,
              viewedAt:  f.Phase || null,
              decision:  f.Decision || null,
              decidedAt: null,
              comments,
            };
          });
          setAllData(map);
          setPhaseState(ph);
        } catch (e) {
          console.error("Load error:", e);
        }
      }, []);

      // Poll every 30s for live updates
      useEffect(() => {
        if (!user) return;
        setDataLoading(true);
        loadData().finally(()=>setDataLoading(false));
        pollRef.current = setInterval(loadData, 30000);
        return () => clearInterval(pollRef.current);
      }, [user, loadData]);

      // Handle token on page load (OAuth redirect return)
      useEffect(() => {
        const hash = window.location.hash;
        if (hash && hash.includes("access_token")) {
          const params = new URLSearchParams(hash.substring(1));
          const accessToken = params.get("access_token");
          if (accessToken) {
            sessionStorage.setItem("pattulo_ms_token", accessToken);
            window.history.replaceState(null, "", window.location.pathname);
            try {
              const payload = JSON.parse(atob(accessToken.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
              const email = (payload.preferred_username || payload.upn || payload.email || "").toLowerCase();
              sessionStorage.setItem("pattulo_ms_email", email);
              const match = REVIEWERS.find(r => r.email.toLowerCase() === email);
              if (match) { setUser(match.id); setTab("review"); }
              else { setUser("admin"); setTab("dashboard"); }
            } catch(e) { console.error("Token parse:", e); }
          }
        }
      }, []);

      async function handleMsLogin() {
        setMsLoading(true);
        try {
          const params = new URLSearchParams({
            client_id: CONFIG.clientId,
            response_type: "token",
            redirect_uri: window.location.origin + window.location.pathname,
            scope: "https://graph.microsoft.com/Sites.ReadWrite.All User.Read",
            response_mode: "fragment",
            nonce: btoa(Math.random().toString()),
            prompt: "select_account",
          });
          window.location.href = `https://login.microsoftonline.com/common/oauth2/v2.0/authorize?${params}`;
        } catch (e) {
          setToast({ msg: "Sign-in failed: " + e.message, type:"error" });
          setMsLoading(false);
        }
      }

      async function handleLogin(id) {
        setUser(id);
        setTab(id==="admin"?"dashboard":"review");
        // Mark viewed
        if (id !== "admin") {
          const reviewer = REVIEWERS.find(r=>r.id===id);
          try {
            await upsertReview(PROJECT.contractNo, reviewer, {
              Phase: now(), Decision: (allData[id]||{}).decision || "pending",
              CommentsJSON: JSON.stringify((allData[id]||{}).comments||[]),
            });
            await loadData();
          } catch(e) { console.error("Mark viewed error:", e); }
        }
      }

      async function handleDecision(decision) {
        const reviewer = REVIEWERS.find(r=>r.id===user);
        setSaving(true);
        try {
          const cur = allData[user] || {};
          await upsertReview(PROJECT.contractNo, reviewer, {
            Decision: decision,
            Phase: cur.viewedAt || now(),
            CommentsJSON: JSON.stringify(cur.comments||[]),
          });
          await loadData();
          setToast({ msg:"Decision saved to SharePoint", type:"success" });
        } catch(e) {
          setToast({ msg:"Save failed — check connection", type:"error" });
        } finally { setSaving(false); }
      }

      async function handleAddComment(comment) {
        const reviewer = REVIEWERS.find(r=>r.id===user);
        setSaving(true);
        try {
          const cur = allData[user] || {};
          const newComments = [...(cur.comments||[]), comment];
          await upsertReview(PROJECT.contractNo, reviewer, {
            Decision: cur.decision || "pending",
            Phase: cur.viewedAt || now(),
            CommentsJSON: JSON.stringify(newComments),
          });
          await loadData();
          setToast({ msg:"Comment saved to SharePoint", type:"success" });
        } catch(e) {
          setToast({ msg:"Save failed — check connection", type:"error" });
        } finally { setSaving(false); }
      }

      async function handlePhaseChange(newPhase) {
        setSaving(true);
        try {
          await setPhase(PROJECT.contractNo, newPhase);
          setPhaseState(newPhase);
          setToast({ msg:`Moved to ${newPhase==="final"?"Final":"Initial"} Review`, type:"success" });
        } catch(e) {
          setToast({ msg:"Phase update failed", type:"error" });
        } finally { setSaving(false); }
      }

      async function handleOwnerDecision(decision, comment) {
        setSaving(true);
        try {
          await upsertReview(PROJECT.contractNo, { id:"owner", name:"Owner" }, {
            Decision: decision,
            Phase: now(),
            CommentsJSON: comment,
          });
          await loadData();
          setToast({ msg:"Owner decision saved to SharePoint", type:"success" });
        } catch(e) {
          setToast({ msg:"Save failed", type:"error" });
        } finally { setSaving(false); }
      }

      if (!user) return (
        <LoginScreen onSelect={handleLogin} onMsLogin={handleMsLogin} msLoading={msLoading} />
      );

      const isAdmin = user === "admin";
      const reviewer = isAdmin ? null : REVIEWERS.find(r=>r.id===user);
      const TABS = isAdmin
        ? [{id:"dashboard",label:"📊 Dashboard"},{id:"reviews",label:"💬 All Reviews"},{id:"owner",label:"✅ Owner Sign-off"}]
        : [{id:"review",label:"💬 Review & Comment"},{id:"dashboard",label:"📊 Dashboard"}];

      return (
        <div style={{ minHeight:"100vh", background:"#f0f4f8" }}>
          {toast && <Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)} />}

          {/* Top bar */}
          <div style={{ background:"#1B3A6B", padding:"0 20px" }}>
            <div style={{ maxWidth:980, margin:"0 auto", display:"flex", alignItems:"center",
              justifyContent:"space-between", height:54 }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, overflow:"hidden" }}>
                <div style={{ background:"#E87722", borderRadius:6, padding:"3px 10px", flexShrink:0 }}>
                  <span style={{ fontFamily:"'DM Mono',monospace", fontWeight:700, fontSize:11,
                    color:"#fff", letterSpacing:"0.1em" }}>PATTULO</span>
                </div>
                <span style={{ color:"rgba(255,255,255,0.4)" }}>|</span>
                <span style={{ color:"#93b4dc", fontSize:12, fontWeight:600, flexShrink:0 }}>
                  {PROJECT.contractNo}
                </span>
                <span style={{ color:"rgba(255,255,255,0.25)", fontSize:12 }}>—</span>
                <span style={{ color:"#fff", fontSize:12, fontWeight:600, overflow:"hidden",
                  textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{PROJECT.contractTitle}</span>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
                <div style={{ width:8, height:8, borderRadius:"50%", background:"#10b981" }} />
                <span style={{ fontSize:11, color:"#93b4dc" }}>SharePoint Live</span>
                <span style={{ fontSize:12, color:"#93b4dc", marginLeft:6 }}>
                  {isAdmin?"John Hoeve (Owner)":reviewer?.name}
                </span>
                <button onClick={()=>{setUser(null);setAllData({});}} style={{
                  background:"rgba(255,255,255,0.1)", border:"none", borderRadius:6,
                  padding:"5px 10px", color:"#fff", fontSize:11, cursor:"pointer" }}>
                  Switch
                </button>
              </div>
            </div>
          </div>

          {/* Phase banner */}
          <div style={{ background:phase==="final"?"#1a4a2a":"#162d4a", padding:"7px 20px" }}>
            <div style={{ maxWidth:980, margin:"0 auto", display:"flex",
              alignItems:"center", justifyContent:"space-between" }}>
              <div style={{ display:"flex", gap:14, alignItems:"center" }}>
                <span style={{ fontFamily:"'DM Mono',monospace", fontSize:11, fontWeight:700,
                  letterSpacing:"0.08em", color:phase==="final"?"#86efac":"#93b4dc" }}>
                  {phase==="final"?"● FINAL REVIEW PHASE":"● INITIAL REVIEW PHASE"}
                </span>
                <span style={{ fontSize:11, color:"rgba(255,255,255,0.3)" }}>

                      {d.url
                        ? <a href={d.url} target="_blank" rel="noopener noreferrer"
                            style={{ fontFamily:"'DM Mono',monospace", fontSize:10,
                              color:"#0ea5e9", textDecoration:"none" }}>Open in SharePoint ↗</a>
                        : <p style={{ fontFamily:"'DM Mono',monospace", fontSize:10,
                            color:"#94a3b8", margin:0 }}>Add URL in CONFIG</p>
                      }
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Tab nav */}
            <div style={{ display:"flex", gap:4, marginBottom:18, background:"#fff",
              borderRadius:10, padding:4, border:"1px solid #e8edf3", width:"fit-content" }}>
              {TABS.map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)} style={{
                  padding:"8px 16px", borderRadius:7, border:"none", cursor:"pointer",
                  background:tab===t.id?"#1B3A6B":"transparent",
                  color:tab===t.id?"#fff":"#64748b", fontWeight:600, fontSize:13,
                  transition:"all 0.15s" }}>{t.label}</button>
              ))}
            </div>

            {/* Content */}
            {tab==="dashboard" && (
              <Dashboard allData={allData} loading={dataLoading} />
            )}
            {tab==="review" && !isAdmin && (
              <ReviewerView
                reviewer={reviewer}
                reviewData={allData[user]}
                allData={allData}
                onDecision={handleDecision}
                onAddComment={handleAddComment}
                saving={saving}
              />
            )}
            {tab==="reviews" && isAdmin && (
              <div>
                {REVIEWERS.map(r=>{
                  const s = allData[r.id]||{};
                  return (
                    <div key={r.id} style={{ marginBottom:24 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
                        <div style={{ width:34, height:34, borderRadius:"50%", background:"#1B3A6B",
                          display:"flex", alignItems:"center", justifyContent:"center" }}>
                          <span style={{ color:"#fff", fontWeight:700, fontSize:12 }}>{initials(r.name)}</span>
                        </div>
                        <div>
                          <span style={{ fontWeight:700, fontSize:14, color:"#1B3A6B" }}>{r.name}</span>
                          <span style={{ fontSize:12, color:"#64748b", marginLeft:8 }}>
                            {r.role} — {r.company}
                          </span>
                        </div>
                        <Badge type={s.decision||(s.viewed?"viewed":"pending")} />
                        <span style={{ marginLeft:"auto", fontFamily:"'DM Mono',monospace",
                          fontSize:12, color:"#94a3b8" }}>
                          {(s.comments||[]).length} comment{(s.comments||[]).length!==1?"s":""}
                        </span>
                      </div>
                      <div style={{ background:"#fff", borderRadius:12, padding:16,
                        border:"1px solid #e8edf3" }}>
                        {(s.comments||[]).length===0
                          ? <p style={{ fontSize:13, color:"#94a3b8", fontStyle:"italic", margin:0 }}>
                              No comments yet.
                            </p>
                          : s.comments.map(c=><CommentCard key={c.id} comment={c} />)
                        }
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            {tab==="owner" && isAdmin && (
              <OwnerSignoff
                ownerData={allData["owner"]}
                onDecide={handleOwnerDecision}
                phase={phase}
                saving={saving}
              />
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
